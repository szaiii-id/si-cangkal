# .github/workflows/tests.yml
#
# CI Pipeline — Code Quality, Backend (Pest) & Frontend Unit/Component (Vitest)
#
# Jobs:
# 1. lint      → Pint + PHPStan + Svelte Check (Fail-fast)
# 2. test-php  → Pest
# 3. test-js   → Vitest

name: Tests (Lint, Pest & Vitest)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'e2e/**'
      - 'playwright.config.ts'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'e2e/**'
      - 'playwright.config.ts'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'
  BUN_VERSION: '1.4.2'
  DB_CONNECTION: 'pgsql'
  DB_HOST: '127.0.0.1'
  DB_PORT: '5432'
  DB_DATABASE: 'sicangkal_db_testing'
  DB_USERNAME: 'sicangkal_dev'
  DB_PASSWORD: 'sicangkal04!'

jobs:
  # ==========================================
  # 1. LINT — Code Quality (Fail Fast)
  # ==========================================
  lint:
    name: Lint (Pint + PHPStan + Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install Composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Prepare environment for Svelte Check / Wayfinder
        run: |
          cp .env.testing .env
          mkdir -p storage/app/firebase
          cat << 'EOF' > storage/app/firebase/titiktemu-ebed3-firebase-adminsdk-fbsvc-a83049da8f.json
          {
            "type": "service_account",
            "project_id": "sicangkal-test",
            "private_key_id": "dummy-key-id",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7W8\n-----END PRIVATE KEY-----\n",
            "client_email": "firebase-adminsdk-dummy@sicangkal-test.iam.gserviceaccount.com",
            "client_id": "000000000000000000000",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Vite+ check (format + lint) BERBEDA dengan svelte-check.
      # Backend format sudah dibersihkan; gate ini sekarang blocking.
      - name: Run Vite+ check
        run: bun run check

      - name: Run Svelte Check
        run: bun run types:check

  # ==========================================
  # 2. PHP TESTS (Pest)
  # ==========================================
  test-php:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DB_DATABASE }}
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install Composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.testing .env
          mkdir -p storage/app/firebase
          cat << 'EOF' > storage/app/firebase/titiktemu-ebed3-firebase-adminsdk-fbsvc-a83049da8f.json
          {
            "type": "service_account",
            "project_id": "sicangkal-test",
            "private_key_id": "dummy-key-id",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7W8\n-----END PRIVATE KEY-----\n",
            "client_email": "firebase-adminsdk-dummy@sicangkal-test.iam.gserviceaccount.com",
            "client_id": "000000000000000000000",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Build frontend
        run: bun run build

      - name: Run Pest
        env:
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_CONTACT_TEST_OVERRIDE: 1000
        run: php artisan test

  # ==========================================
  # 3. JS TESTS (Vitest)
  # ==========================================
  test-js:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Run Vitest
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: bun run test

  # ==========================================
  # 4. SECURITY AUDIT (informasional)
  # ==========================================
  # TODO: jadikan blocking setelah temuan lama dibersihkan.
  # Saat ini vite-plus 0.3.0 masih menarik tinypool <=2.1.0 (critical)
  # sehingga gate blocking akan langsung membuat CI merah.
  security-audit:
    name: Security Audit (Composer + Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Audit Composer
        run: composer audit --locked

      # Allowlist advisories tercatat dan kedaluwarsa di scripts/audit-check.ts.
      - name: Audit Bun
        run: bun run audit:check