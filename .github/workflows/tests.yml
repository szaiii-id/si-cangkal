# .github/workflows/tests.yml
#
# CI Pipeline — Code Quality, Backend (Pest) & Frontend Unit/Component (Vitest)
#
# Jobs:
# 1. lint      → Pint + PHPStan + Svelte Check (Fail-fast)
# 2. test-php  → Pest (functional + rate-limit)
# 3. test-js   → Vitest

name: Tests (Lint, Pest & Vitest)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'e2e/**'
      - 'playwright.config.ts'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'e2e/**'
      - 'playwright.config.ts'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  DB_CONNECTION: 'pgsql'
  DB_HOST: '127.0.0.1'
  DB_PORT: '5432'
  DB_DATABASE: 'sicangkal_db_testing'
  DB_USERNAME: 'sicangkal_dev'
  DB_PASSWORD: 'sicangkal04!'

jobs:
  # ==========================================
  # 1. LINT — Code Quality (Fail Fast)
  # ==========================================
  lint:
    name: Lint (Pint + PHPStan + Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install Composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Prepare environment for Svelte Check / Wayfinder
        run: |
          cp .env.testing .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run Svelte Check
        run: bun run types:check

  # ==========================================
  # 2. PHP TESTS (Pest)
  # ==========================================
  test-php:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DB_DATABASE }}
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install Composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Build frontend
        run: bun run build

      - name: Run Pest (functional, exclude rate-limit)
        env:
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_CONTACT_TEST_OVERRIDE: 1000
        run: php artisan test --exclude-group=rate-limit

      - name: Run Pest (rate-limit)
        env:
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 5
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 3
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 3
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 5
        run: php artisan test --group=rate-limit

  # ==========================================
  # 3. JS TESTS (Vitest)
  # ==========================================
  test-js:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - name: Run Vitest
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: bun run test